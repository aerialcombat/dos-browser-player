[sdl]
autolock=false
fullresolution=original
aspect=false

[dosbox]
machine=svga_s3

[render]
aspect=false
scaler=none

[cpu]
core=auto
cputype=auto
cycles=8000

[mixer]
rate=48000
blocksize=512

[midi]
